# Dependabot (issue #86): uma vez por semana confere se alguma dependência
# tem atualização de segurança e abre PRs AGRUPADOS (um para o npm, um para as
# Actions), que passam pelo CI como qualquer outro PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Versões grandes (major) mudam regras e quebram coisas: ficam para uma
    # issue própria. Isto só vale para atualizações de VERSÃO; correções de
    # SEGURANÇA continuam chegando sempre, mesmo se forem major.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      seguranca-npm:
        applies-to: security-updates
        patterns: ["*"]
      dependencias-npm:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
